<style>

<script>
/* ══════ HELPERS DE DIBUJO ══════ */
function C(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function T(ctx,s,x,y,o){o=o||{};ctx.fillStyle=o.col?C(o.col):C('--ink');
  ctx.font=(o.b?'600 ':'')+(o.s||12)+'px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
  ctx.textAlign=o.a||'left';ctx.textBaseline=o.vb||'alphabetic';ctx.fillText(s,x,y);}
function RR(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function alpha(hex,a){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
/* Región de un Venn de N círculos: mask[i]=true => dentro del círculo i */
function region(ctx,W,H,cs,mask,color){
  const oc=document.createElement('canvas');oc.width=W;oc.height=H;const o=oc.getContext('2d');
  o.fillStyle=color;
  const pos=cs.map((c,i)=>i).filter(i=>mask[i]);
  if(pos.length){pos.forEach((i,k)=>{if(k)o.globalCompositeOperation='destination-in';
    o.beginPath();o.arc(cs[i].x,cs[i].y,cs[i].r,0,7);o.fill();});}
  else{o.fillRect(0,0,W,H);}
  o.globalCompositeOperation='destination-out';
  cs.forEach((c,i)=>{if(!mask[i]){o.beginPath();o.arc(c.x,c.y,c.r,0,7);o.fill();}});
  ctx.drawImage(oc,0,0);
}
function outlines(ctx,cs){ctx.strokeStyle=C('--muted');ctx.lineWidth=1.6;
  cs.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);ctx.stroke();
    T(ctx,c.lab,c.lx,c.ly,{s:15,b:1,a:'center'});});}
function bar(ctx,x,y,w,h,frac,color,lab,val){
  ctx.fillStyle=alpha(C('--line'),1);RR(ctx,x,y,w,h,h/2);ctx.fill();
  ctx.fillStyle=C(color);RR(ctx,x,y,Math.max(2,w*Math.min(1,Math.max(0,frac))),h,h/2);ctx.fill();
  T(ctx,lab,x,y-7,{s:12,col:'--muted'});
  if(val!==undefined)T(ctx,val,x+w,y-7,{s:12.5,b:1,a:'right'});
}
/* Simulador genérico para espacios muestrales finitos (grilla + checkboxes + operación) */
function simFinito(outs,cols,evs,label){
  return {
    controles: evs.map(e=>({id:e.id,label:e.label,tipo:'check',val:1})).concat([
      {id:'modo',tipo:'select',label:'Operación',val:0,
       opts:['Intersección de los marcados','Unión de los marcados','El 1.º marcado sin los demás']}]),
    draw:function(ctx,W,H,p){
      const sel=evs.filter(e=>p[e.id]);
      const test=o=>{ if(!sel.length)return false;
        if(p.modo===0)return sel.every(e=>e.pred(o));
        if(p.modo===1)return sel.some(e=>e.pred(o));
        return sel[0].pred(o)&&sel.slice(1).every(e=>!e.pred(o)); };
      const rows=Math.ceil(outs.length/cols), pad=16, top=34;
      const cw=Math.min(120,(W-2*pad)/cols), ch=Math.min(56,(H-top-pad)/rows);
      const x0=(W-cw*cols)/2, y0=top+((H-top-pad)-ch*rows)/2;
      T(ctx,label||'Espacio muestral',pad,22,{s:12.5,col:'--muted'});
      let n=0;
      outs.forEach((o,k)=>{
        const r=Math.floor(k/cols), c=k%cols;
        const x=x0+c*cw+3, y=y0+r*ch+3, w=cw-6, h=ch-6;
        const on=test(o); if(on)n++;
        ctx.fillStyle=on?alpha(C('--accent'),.30):C('--panel');
        RR(ctx,x,y,w,h,7);ctx.fill();
        ctx.strokeStyle=on?C('--accent'):C('--line');ctx.lineWidth=on?1.8:1;ctx.stroke();
        T(ctx,o.t,x+w/2,y+h/2+4.5,{s:Math.min(14,w/4.2),b:on,a:'center',col:on?'--ink':'--muted'});
      });
      return {"Elementos":n, "Probabilidad":(n/outs.length).toFixed(4), "|S|":outs.length};
    }
  };
}

/* ══════ HELPERS ADICIONALES PARA ESTA GUÍA ══════ */
function tiles(ctx,W,H,items,label,mark){
  const n=items.length;
  let cols=Math.max(1,Math.round(Math.sqrt(n*(W/H)*0.45))); cols=Math.min(cols,n);
  const rows=Math.ceil(n/cols), pad=16, top=38, bot=26;
  const cw=Math.min(170,(W-2*pad)/cols), ch=Math.min(54,(H-top-bot)/rows);
  const x0=(W-cw*cols)/2, y0=top+((H-top-bot)-ch*rows)/2;
  T(ctx,label,pad,24,{s:12.5,col:'--muted'});
  items.forEach((s,k)=>{
    const r=Math.floor(k/cols), c=k%cols;
    const x=x0+c*cw+3, y=y0+r*ch+3, w=cw-6, h=ch-6;
    const on=mark?mark(s,k):false;
    ctx.fillStyle=on?alpha(C('--accent'),.30):C('--panel');
    RR(ctx,x,y,w,h,7);ctx.fill();
    ctx.strokeStyle=on?C('--accent'):C('--line');ctx.lineWidth=on?1.8:1;ctx.stroke();
    const fs=Math.min(15,(w-10)/(String(s).length*0.60+0.5));
    T(ctx,s,x+w/2,y+h/2+fs*0.36,{s:fs,b:on,a:'center',col:on?'--ink':'--muted'});
  });
}
function LCG(seed){let s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function venn2(W,H){
  const R=Math.min(120,H*0.34), cx=W/2, cy=H*0.54, d=R*0.85;
  return [{x:cx-d/2,y:cy,r:R,lab:'A',lx:cx-d/2-R*0.7,ly:cy-R-14},
          {x:cx+d/2,y:cy,r:R,lab:'B',lx:cx+d/2+R*0.7,ly:cy-R-14}];
}
function venn3(W,H){
  const R=Math.min(105,H*0.30), cx=W/2, cy=H*0.50, d=R*0.95;
  return [{x:cx-d/2,y:cy-d*0.30,r:R,lab:'M',lx:cx-d*1.15,ly:cy-R-6},
          {x:cx+d/2,y:cy-d*0.30,r:R,lab:'A',lx:cx+d*1.15,ly:cy-R-6},
          {x:cx,     y:cy+d*0.62,r:R,lab:'C',lx:cx,       ly:cy+R+d*0.62+6}];
}
function marco(ctx,W,H,lab){
  ctx.strokeStyle=C('--line');ctx.lineWidth=1.4;ctx.strokeRect(10,10,W-20,H-20);
  T(ctx,lab||'S',W-18,H-16,{s:13,a:'right',col:'--muted'});
}

/* ══════ HELPERS PROPIOS DE ESTA GUÍA ══════ */
function combi(n,k){ if(k<0||k>n) return 0; let r=1; for(let i=1;i<=k;i++) r=r*(n-k+i)/i; return r; }
function binom(k,n,p){ return combi(n,k)*Math.pow(p,k)*Math.pow(1-p,n-k); }
function fm(v,d){ if(!isFinite(v)) return '—'; return Number(v).toFixed(d===undefined?4:d).replace('.',','); }
function fr(a,b){ return a+'/'+b; }
function gauss(R){ let u=0; while(u<1e-12) u=R(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*R()); }
function linea(ctx,x1,y1,x2,y2,col,lw,dash){ ctx.strokeStyle=C(col||'--line'); ctx.lineWidth=lw||1.2;
  ctx.setLineDash(dash||[]); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.setLineDash([]); }
function punto(ctx,x,y,r,col){ ctx.fillStyle=C(col||'--accent'); ctx.beginPath(); ctx.arc(x,y,r||3,0,7); ctx.fill(); }

/* Ejes cartesianos. Devuelve el mapeo {X(x),Y(y)} y los bordes. */
function ejes(ctx,W,H,x0,x1,y0,y1,o){
  o=o||{}; const L=o.L||58,R=o.R||22,Tp=o.T||36,B=o.B||40;
  const m={x0,x1,y0,y1,L,R,T:Tp,B,W,H};
  m.X=x=>L+(x-x0)/(x1-x0)*(W-L-R); m.Y=y=>H-B-(y-y0)/(y1-y0)*(H-Tp-B);
  linea(ctx,L,H-B,W-R,H-B,'--line',1.2); linea(ctx,L,Tp,L,H-B,'--line',1.2);
  const nx=o.nx||5, ny=o.ny||4;
  for(let i=0;i<=nx;i++){ const v=x0+(x1-x0)*i/nx; T(ctx,fm(v,o.dx===undefined?1:o.dx),m.X(v),H-B+16,{s:11,a:'center',col:'--muted'}); }
  for(let i=0;i<=ny;i++){ const v=y0+(y1-y0)*i/ny; linea(ctx,L,m.Y(v),W-R,m.Y(v),'--line',.5);
    T(ctx,fm(v,o.dy===undefined?2:o.dy),L-6,m.Y(v)+4,{s:10.5,a:'right',col:'--muted'}); }
  if(o.tit) T(ctx,o.tit,L,22,{s:12.5,col:'--muted'});
  if(o.xl) T(ctx,o.xl,W-R,H-B-6,{s:12,a:'right',col:'--muted'});
  return m;
}
function curvaF(ctx,m,f,col,lw,a,b,N){
  a=(a===undefined)?m.x0:a; b=(b===undefined)?m.x1:b; N=N||300;
  ctx.strokeStyle=C(col||'--accent'); ctx.lineWidth=lw||2.2; ctx.beginPath(); let on=false;
  for(let i=0;i<=N;i++){ const x=a+(b-a)*i/N, v=f(x);
    if(!isFinite(v)){on=false;continue;}
    const y=Math.max(m.y0,Math.min(m.y1,v)); const X=m.X(x),Y=m.Y(y);
    if(on) ctx.lineTo(X,Y); else {ctx.moveTo(X,Y); on=true;} }
  ctx.stroke();
}
function sombra(ctx,m,f,a,b,col,al){
  a=Math.max(a,m.x0); b=Math.min(b,m.x1); if(b<=a) return;
  ctx.fillStyle=alpha(C(col||'--warn'),al||.35); ctx.beginPath(); ctx.moveTo(m.X(a),m.Y(0));
  const N=160; for(let i=0;i<=N;i++){ const x=a+(b-a)*i/N; let v=f(x); if(!isFinite(v)) v=m.y1;
    ctx.lineTo(m.X(x),m.Y(Math.max(m.y0,Math.min(m.y1,v)))); }
  ctx.lineTo(m.X(b),m.Y(0)); ctx.closePath(); ctx.fill();
}
/* Histograma de densidad de una muestra (escala de densidad, para superponer con f). */
function histo(ctx,m,xs,nb,a,b,col){
  if(!xs||!xs.length) return; const h=(b-a)/nb, c=new Array(nb).fill(0);
  xs.forEach(v=>{ const k=Math.floor((v-a)/h); if(k>=0&&k<nb) c[k]++; });
  ctx.fillStyle=alpha(C(col||'--accent2'),.45);
  c.forEach((n,k)=>{ const d=n/(xs.length*h); const x=m.X(a+k*h), w=m.X(a+(k+1)*h)-x;
    const y=m.Y(Math.min(d,m.y1)); ctx.fillRect(x+.5,y,Math.max(1,w-1),m.Y(0)-y); });
}
function nube(ctx,m,pts,colf,r){ pts.forEach(p=>{ ctx.fillStyle=colf?colf(p):alpha(C('--accent2'),.5);
  ctx.fillRect(m.X(p[0])-(r||1.3),m.Y(p[1])-(r||1.3),2*(r||1.3),2*(r||1.3)); }); }
/* Tabla de una conjunta discreta con marginales. P[i][j]=P(X=xs[j],Y=ys[i]). */
function tablaConj(ctx,W,H,xs,ys,P,o){
  o=o||{}; const nr=ys.length, nc=xs.length;
  const x0=o.x0||80, top=o.top||46, cw=Math.min(o.cw||86,(W-x0-120)/(nc+1)), ch=Math.min(46,(H-top-40)/(nr+1));
  T(ctx,o.tit||'',x0-60,24,{s:12.5,col:'--muted'});
  T(ctx,(o.yl||'y')+' \\ '+(o.xl||'x'),x0-8,top-8,{s:12,a:'right',col:'--muted'});
  let mx=0; P.forEach(r=>r.forEach(v=>{if(v>mx)mx=v;}));
  xs.forEach((x,j)=>T(ctx,String(x),x0+j*cw+cw/2,top-8,{s:13,b:1,a:'center'}));
  T(ctx,'p('+(o.yl||'y')+')',x0+nc*cw+cw/2+8,top-8,{s:12,a:'center',col:'--muted'});
  ys.forEach((y,i)=>{
    T(ctx,String(y),x0-12,top+i*ch+ch/2+5,{s:13,b:1,a:'right'});
    let s=0;
    xs.forEach((x,j)=>{ const v=P[i][j]; s+=v; const hl=o.hl?o.hl(x,y):false;
      const X=x0+j*cw, Y=top+i*ch;
      ctx.fillStyle=v>0?alpha(C(hl?'--warn':'--accent'),.12+.55*v/mx):C('--panel2');
      RR(ctx,X+2,Y+2,cw-4,ch-4,6); ctx.fill();
      if(hl){ ctx.strokeStyle=C('--warn'); ctx.lineWidth=2; ctx.stroke(); }
      T(ctx,v>0?(o.lab?o.lab(v):fm(v,3)):'0',X+cw/2,Y+ch/2+(o.emp?0:5),{s:12.5,a:'center',col:v>0?'--ink':'--muted'});
      if(o.emp) T(ctx,fm(o.emp[i][j],3),X+cw/2,Y+ch/2+15,{s:10.5,a:'center',col:'--accent2'});
    });
    T(ctx,o.lab?o.lab(s):fm(s,3),x0+nc*cw+cw/2+8,top+i*ch+ch/2+5,{s:12.5,a:'center',col:'--muted'});
  });
  const yb=top+nr*ch;
  T(ctx,'p('+(o.xl||'x')+')',x0-12,yb+ch/2+5,{s:12,a:'right',col:'--muted'});
  xs.forEach((x,j)=>{ let s=0; ys.forEach((y,i)=>s+=P[i][j]);
    T(ctx,o.lab?o.lab(s):fm(s,3),x0+j*cw+cw/2,yb+ch/2+5,{s:12.5,a:'center',col:'--muted'}); });
  if(o.emp) T(ctx,'en verde: frecuencias simuladas',x0,H-10,{s:11.5,col:'--accent2'});
  return {x0,top,cw,ch,right:x0+(nc+1)*cw+16};
}
/* Barras comparadas: teórica (azul) vs simulada (verde). */
function barras(ctx,W,H,labs,pt,pe,tit,hl,o){
  o=o||{}; const L=o.L||56,R=o.R||20,Tp=38,B=46, n=labs.length, gw=(W-L-R)/n;
  let mx=o.max||0; pt.forEach(v=>{if(v>mx)mx=v;}); if(pe) pe.forEach(v=>{if(v>mx)mx=v;}); mx=mx||1;
  const y0=H-B, hh=y0-Tp;
  for(let g=0;g<=4;g++){ const y=y0-hh*g/4; linea(ctx,L,y,W-R,y,'--line',.6); T(ctx,fm(mx*g/4,3),L-6,y+4,{s:10.5,a:'right',col:'--muted'}); }
  T(ctx,tit||'',L,22,{s:12.5,col:'--muted'});
  const bw=pe?gw*0.38:gw*0.7;
  labs.forEach((lb,i)=>{ const x=L+i*gw+gw*0.12, on=hl?hl(i):false;
    ctx.fillStyle=alpha(C(on?'--warn':'--accent'),.9); const h=hh*pt[i]/mx; RR(ctx,x,y0-h,bw,Math.max(1,h),3); ctx.fill();
    if(pe){ ctx.fillStyle=alpha(C('--accent2'),.9); const h2=hh*pe[i]/mx; RR(ctx,x+bw+2,y0-h2,bw,Math.max(1,h2),3); ctx.fill(); }
    if(n<=30) T(ctx,String(lb),L+i*gw+gw/2,y0+16,{s:n>20?10:12,a:'center',col:on?'--warn':'--ink'}); });
  ctx.fillStyle=C('--accent'); RR(ctx,L,H-18,11,11,3); ctx.fill(); T(ctx,o.lt||'teórica',L+15,H-8,{s:11.5,col:'--muted'});
  if(pe){ ctx.fillStyle=C('--accent2'); RR(ctx,L+100,H-18,11,11,3); ctx.fill(); T(ctx,o.le||'simulada',L+115,H-8,{s:11.5,col:'--muted'}); }
}
function duelo(ctx,W,H,a,b){
  const m=Math.max(a.v,b.v)||1;
  bar(ctx,70,110,W-160,30,a.v/m,a.col||'--accent',a.lab,a.txt);
  bar(ctx,70,210,W-160,30,b.v/m,b.col||'--accent2',b.lab,b.txt);

function muestra(N,seed,gen){ const R=LCG(seed), a=[]; for(let i=0;i<N;i++) a.push(gen(R)); return a; }
function expo(R,media){ let u=0; while(u<1e-12) u=R(); return -media*Math.log(u); }
function frac(a,f){ let c=0; a.forEach(v=>{ if(f(v)) c++; }); return c/a.length; }
function marco2(ctx,m,poly,col){ ctx.strokeStyle=C(col||'--accent'); ctx.lineWidth=2; ctx.beginPath();
  poly.forEach((q,i)=>{ i?ctx.lineTo(m.X(q[0]),m.Y(q[1])):ctx.moveTo(m.X(q[0]),m.Y(q[1])); }); ctx.closePath(); ctx.stroke(); }
/* ejes con la misma escala en x e y dentro de un recuadro */
function ejesIso(ctx,W,H,x0,x1,y0,y1,o){ o=o||{}; const Tp=o.T||36,B=o.B||36, hh=H-Tp-B, s=hh/(y1-y0), ww=s*(x1-x0);
  const L=o.L!==undefined?o.L:(W-ww)/2; return ejes(ctx,L+ww+(o.R||0),H,x0,x1,y0,y1,Object.assign({L:L,R:o.R||0,T:Tp,B:B},o)); }

const gW9=x=>x<=8?Math.cbrt(x):(x<=15?(x-1)*(x-1)/7-5:2*x-7);
const fW9=w=>w<=0?0:(w<=2?0.6*w*w*Math.exp(-w*w*w/5):(w<=23?7/(10*Math.sqrt(7*(w+5)))*Math.exp(-(1+Math.sqrt(7*(w+5)))/5):Math.exp(-(w+7)/10)/10));
const fZa4=z=>{ if(z<0||z>8) return 0; if(z<=1) return 40*z*z/723; if(z<=4) return 20*(z+1)/723;

{

  pasos:[

    {t:"La suma de dos uniformes", h:"Tiene densidad triangular en $[0,2]$ con pico en 1."},
    {t:"Mezcla", h:"$f_Z=\\tfrac13\\mathbf 1_{[0,1]}+\\tfrac23$ triángulo. $E(Z)=\\tfrac13\\cdot\\tfrac12+\\tfrac23\\cdot1=\\tfrac56$."},
    {t:"Bayes", h:"$P(Z>\\tfrac34)=\\tfrac9{16}$ y $P(D<3,Z>\\tfrac34)=\\tfrac13\\cdot\\tfrac14$: $P(D<3\\mid Z>\\tfrac34)=\\tfrac4{27}$."},

      let a=0,b=0; for(let i=0;i<xs.length;i++) if(xs[i]>t){ b++; if(dd[i]<3) a++; }

{
  id:"ej8", g:"Probabilidad geométrica (6–8)", titulo:"8. Punto en el círculo y su cuerda",
  tema:"distancia al centro · paradoja de Bertrand",
  enunciado:ENUN.ej8,
  resultado:"(a) $P(|OP|<d)=d^2$, $0\\le d\\le1$. (b) $X=2\\sqrt{1-\\rho^2}>\\sqrt3\\iff\\rho<\\tfrac12$, así que $P=\\tfrac14$.",
  pasos:[
    {t:"Áreas", h:"$P(|OP|<d)=\\dfrac{\\pi d^2}{\\pi}=d^2$."},
    {t:"La cuerda", h:"La cuerda con punto medio $P$ es perpendicular a $OP$; por Pitágoras mide $2\\sqrt{1-\\rho^2}$, con $\\rho=|OP|$."},
    {t:"Traducir", h:"$2\\sqrt{1-\\rho^2}>\\sqrt3\\iff\\rho<\\tfrac12$, y por (a) eso tiene probabilidad $\\tfrac14$."},
    {t:"Bertrand", h:"“Una cuerda al azar” depende de cómo se sortee: por el punto medio da $\\tfrac14$; con dos puntos del borde, $\\tfrac13$."}
  ],
  sim:{
    controles:[ {id:"d", label:"d (×100)", min:5, max:100, step:1, val:50} ],
    acciones:[ {label:"Otro punto", fn:(st,rep)=>{ st.k=(st.k||0)+1; rep(); }} ],
    draw:function(ctx,W,H,p,st){
      const d=p.d/100, R=LCG(8), pts=[];
      while(pts.length<2500){ const x=2*R()-1, y=2*R()-1; if(x*x+y*y<1) pts.push([x,y]); }
      const m=ejesIso(ctx,W*0.6,H,-1.1,1.1,-1.1,1.1,{L:60,nx:4,ny:4,dx:1,dy:1,tit:'Verde: |OP| < d'});
      nube(ctx,m,pts,q=>Math.hypot(q[0],q[1])<d?alpha(C('--accent2'),.85):alpha(C('--muted'),.45),1.4);
      ctx.strokeStyle=C('--accent'); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(m.X(0),m.Y(0),m.X(1)-m.X(0),0,7); ctx.stroke();
      const R2=LCG(900+(st.k||0)); let q; do{ q=[2*R2()-1,2*R2()-1]; }while(q[0]*q[0]+q[1]*q[1]>=1);
      const rho=Math.hypot(q[0],q[1]), hl=Math.sqrt(1-rho*rho), ux=-q[1]/(rho||1), uy=q[0]/(rho||1);
      linea(ctx,m.X(q[0]-hl*ux),m.Y(q[1]-hl*uy),m.X(q[0]+hl*ux),m.Y(q[1]+hl*uy),rho<.5?'--accent2':'--warn',2.6);

    }

  resultado:"(a) $\\tfrac12$ y $\\tfrac14$. (b) $f_Y(y)=-\\ln y$, $0<y<1$. (c) $\\dfrac{\\ln3}{-\\ln y}$ si $y\\le\\tfrac14$; $\\dfrac{\\ln(3/(4y))}{-\\ln y}$ si $\\tfrac14<y<\\tfrac34$; $0$ si $y\\ge\\tfrac34$.",
  pasos:[
    {t:"Conjunta", h:"$f(x,y)=f_X(x)f_{Y\\mid X}(y\\mid x)=\\tfrac1x$ en $0\\le y\\le x\\le1$."},
    {t:"(a)", h:"Dado $X=\\tfrac12$, $Y\\sim Un(0,\\tfrac12)$: $\\tfrac12$. Sin condicionar, $\\int_{1/4}^{1/2}(-\\ln y)dy=\\tfrac14$ exacto."},
    {t:"(b)", h:"$f_Y(y)=\\int_y^1\\tfrac{dx}x=-\\ln y$: se acumula cerca de 0."},
    {t:"(c) Bayes continuo", h:"$f_{X\\mid Y}(x\\mid y)=\\dfrac{1/x}{-\\ln y}$ en $[y,1]$; se integra entre $\\max(y,\\tfrac14)$ y $\\tfrac34$."}
  ],
  sim:{
    controles:[ {id:"y", label:"Condicionar a Y ≈ y (×100)", min:2, max:95, step:1, val:20} ],
    draw:function(ctx,W,H,p){
      const y0=p.y/100, R=LCG(14), pts=[];
      for(let i=0;i<5000;i++){ const x=R(); pts.push([x,x*R()]); }
      const m=ejesIso(ctx,W*0.5,H,0,1,0,1,{L:60,nx:4,ny:4,dx:2,dy:2,tit:'(X, Y); franja Y ≈ y en naranja'});
      nube(ctx,m,pts,q=>Math.abs(q[1]-y0)<.015?C('--warn'):alpha(C('--accent2'),.55),1.3);
      linea(ctx,m.X(.25),m.Y(0),m.X(.25),m.Y(1),'--accent',1,[4,4]); linea(ctx,m.X(.75),m.Y(0),m.X(.75),m.Y(1),'--accent',1,[4,4]);
      const teo=y0>=.75?0:Math.log(.75/Math.max(y0,.25))/(-Math.log(y0));
      const band=pts.filter(q=>Math.abs(q[1]-y0)<.015);
      T(ctx,'P(1/4 ≤ X ≤ 3/4 | Y = y)',W*0.56,120,{s:13,col:'--muted'}); T(ctx,fm(teo,4),W*0.56,152,{s:26,b:1,col:'--accent'});
      T(ctx,'en la franja simulada: '+fm(frac(band,q=>q[0]>=.25&&q[0]<=.75),3)+' ('+band.length+' puntos)',W*0.56,186,{s:13.5,col:'--accent2'});
      T(ctx,'f_Y(y) = −ln y = '+fm(-Math.log(y0),3),W*0.56,230,{s:13.5,col:'--muted'});
      return {"y":fm(y0,2),"P(1/4 ≤ X ≤ 3/4 | Y = y)":fm(teo,4)};
    }
  }
},
{
  id:"ej15", g:"Vectores aleatorios continuos (11–15)", titulo:"15. Regresiones de 8xy",
  tema:"esperanza condicional continua",
  enunciado:ENUN.ej15,
  resultado:"$E(Y\\mid X)=\\dfrac{2X}{3}$, $\\;E(X\\mid Y)=\\dfrac{2(1+Y+Y^2)}{3(1+Y)}$.",
  pasos:[
    {t:"Marginales", h:"$f_X(x)=4x^3$ y $f_Y(y)=4y(1-y^2)$ en $(0,1)$."},
    {t:"Condicionales", h:"$f_{Y\\mid X}(y\\mid x)=\\tfrac{2y}{x^2}$ en $(0,x)$; $f_{X\\mid Y}(x\\mid y)=\\tfrac{2x}{1-y^2}$ en $(y,1)$."},
    {t:"E(Y | X)", h:"$\\int_0^x y\\tfrac{2y}{x^2}dy=\\tfrac{2x}3$: una recta."},
    {t:"E(X | Y)", h:"$\\int_y^1\\tfrac{2x^2}{1-y^2}dx=\\tfrac{2(1-y^3)}{3(1-y^2)}=\\tfrac{2(1+y+y^2)}{3(1+y)}$: una curva que va de $\\tfrac23$ a $1$."},
    {t:"Control", h:"$E[E(Y\\mid X)]=\\tfrac23E(X)=\\tfrac23\\cdot\\tfrac45=\\tfrac8{15}=E(Y)$."}
  ],
  sim:{
    controles:[ {id:"x", label:"x (×100)", min:5, max:99, step:1, val:60} ],
    draw:function(ctx,W,H,p){
      const x0=p.x/100, R=LCG(15), pts=[];
      while(pts.length<4000){ const x=R(), y=R(); if(y<x && R()<x*y) pts.push([x,y]); }
      const m=ejesIso(ctx,W*0.6,H,0,1,0,1,{L:60,nx:4,ny:4,dx:2,dy:2,tit:'Puntos de 8xy; E(Y|X=x) naranja, E(X|Y=y) azul'});
      nube(ctx,m,pts,null,1.3);
      curvaF(ctx,m,x=>2*x/3,'--warn',2.6);
      ctx.strokeStyle=C('--accent'); ctx.lineWidth=2.6; ctx.beginPath(); for(let i=0;i<=100;i++){ const y=i/101, xx=2*(1+y+y*y)/(3*(1+y)); i?ctx.lineTo(m.X(xx),m.Y(y)):ctx.moveTo(m.X(xx),m.Y(y)); } ctx.stroke();
      linea(ctx,m.X(x0),m.Y(0),m.X(x0),m.Y(x0),'--warn',1,[4,4]); punto(ctx,m.X(x0),m.Y(2*x0/3),6,'--warn');
      const band=pts.filter(q=>Math.abs(q[0]-x0)<.02); const me=band.length?band.reduce((a,q)=>a+q[1],0)/band.length:NaN;
      return {"E(Y | X = x) = 2x/3":fm(2*x0/3,4),"promedio en la franja":fm(me,4)};
    }
  }
},

{

    {t:"Resultado", h:"$\\approx0{,}5533$ rad $\\approx31{,}7°$, más que el ángulo hacia el centro del rectángulo, $\\arctan\\tfrac12\\approx0{,}4636$: el promedio de la función no es la función del promedio."}

{
  id:"a2", g:"Ejercicios adicionales", titulo:"A2. Lluvia y rendimiento: una variable mixta",
  tema:"átomos + parte continua",
  enunciado:ENUN.a2,
  resultado:"(a) $F_H$: $\\tfrac1{32}$ en $[0,3)$, salto de $\\tfrac{23}{32}$ en 3, parte continua en $(3,67]$. (b) $P(H\\ge31)=\\tfrac3{32}$. (c) Ni continua ni discreta: mixta.",
  pasos:[
    {t:"Átomos", h:"$H=3$ si $X\\le6$: $P=\\tfrac{23}{32}$. $H=0$ si $X>10$: $P=\\tfrac1{32}$."},
    {t:"Parte continua", h:"Para $6<X\\le10$, $H=X^2-33$ recorre $(3,67]$ con masa $\\tfrac14$."},
    {t:"(b)", h:"$H\\ge31\\iff8\\le X\\le10$: $\\int_8^{10}\\tfrac{12-x}{64}dx=\\tfrac3{32}$."},
    {t:"(c)", h:"Tiene átomos (no es continua) y los átomos no suman 1 (no es discreta)."}
  ],
  sim:{
    controles:[ {id:"h", label:"h", min:0, max:70, step:1, val:31} ],
    draw:function(ctx,W,H,p){
      const Fh=h=>{ if(h<0) return 0; if(h<3) return 1/32; if(h>=67) return 1; const s=Math.sqrt(h+33); return 0.75+(12*(s-6)-(s*s-36)/2)/64; };
      const m=ejes(ctx,W,H,-5,72,0,1,{nx:11,ny:4,dx:0,dy:2,tit:'Función de distribución de H: saltos en 0 y 3, tramo continuo en (3, 67]'});
      curvaF(ctx,m,Fh,'--accent',2.6,-5,-0.001); curvaF(ctx,m,Fh,'--accent',2.6,0,2.999); curvaF(ctx,m,Fh,'--accent',2.6,3,72,400);
      [[0,0,1/32],[3,1/32,24/32]].forEach(j=>{ linea(ctx,m.X(j[0]),m.Y(j[1]),m.X(j[0]),m.Y(j[2]),'--warn',1.4,[3,3]); punto(ctx,m.X(j[0]),m.Y(j[2]),5,'--accent'); });
      punto(ctx,m.X(p.h),m.Y(Fh(p.h)),6,'--warn');
      return {"F_H(h)":fm(Fh(p.h),4),"P(H ≥ 31)":"3/32 ≈ 0,0938"};
    }
  }
},
{

{
  id:"a4", g:"Ejercicios adicionales", titulo:"A4. Z = 3X + Y sobre una región curva",
  tema:"densidad de una combinación lineal · límites por tramos",
  enunciado:ENUN.a4,
  resultado:"$c=\\tfrac{60}{241}$; $f_Z(z)=\\tfrac1{723}\\big[40z^2$ en $[0,1]$; $20(z+1)$ en $(1,4]$; $40z^2+270z-270-90(z+1)\\sqrt{4z-7}$ en $(4,6]$; $630z-990-90(z+1)\\sqrt{4z-7}$ en $(6,8]\\big]$.",
  pasos:[
    {t:"Constante", h:"$\\int_{[0,1]^2}(x+y)=1$ y la región curva aporta $\\tfrac{181}{60}$: $c=\\tfrac{60}{241}$."},
    {t:"Fórmula de la densidad", h:"$f_Z(z)=\\int f(x,z-3x)\\,dx$, con integrando $c(z-2x)$."},
    {t:"Límites", h:"Cuadrado: $x\\in[\\tfrac{z-1}3,\\tfrac z3]\\cap[0,1]$. Región curva: $x\\in[\\max(1,r(z)),\\min(2,\\tfrac z3)]$ con $r(z)=\\tfrac{-1+\\sqrt{4z-7}}2$."},
    {t:"Tramos", h:"Los límites cambian en $z=1,3,4,6,8$. En $[3,4]$ los aportes de las dos regiones suman la misma recta que en $[1,3]$."},
    {t:"Controles", h:"$f_Z$ es continua, se anula en 8, integra 1 y coincide con la simulación."}
  ],
  sim:{
    controles:[],
    draw:function(ctx,W,H,p){
      const R=LCG(41), zs=[], pts=[];
      while(zs.length<20000){ const x=2*R(), y=2*R(); const ok=(x<=1&&y<=1)||(x>1&&y<=(x-1)*(x-1)+1); if(ok&&R()*4<=x+y){ zs.push(3*x+y); if(pts.length<1500) pts.push([x,y]); } }
      const m0=ejesIso(ctx,W*0.3,H,0,2,0,2,{L:50,nx:2,ny:2,dx:0,dy:0,tit:'Soporte'});
      nube(ctx,m0,pts,null,1.3); curvaF(ctx,m0,x=>(x-1)*(x-1)+1,'--accent',1.8,1,2);
      const m=ejes(ctx,W,H,0,8,0,0.3,{L:W*0.36,nx:8,ny:3,dx:0,dy:1,tit:'f_Z (azul) e histograma (verde)'});
      histo(ctx,m,zs,80,0,8); curvaF(ctx,m,fZa4,'--accent',2.4,0,8,800);
      [1,3,4,6].forEach(z=>linea(ctx,m.X(z),m.Y(0),m.X(z),m.Y(.3),'--warn',.8,[3,4]));
      return {"P(Z ≤ 4) fórmula":fm(40/(3*723)+(20/723)*10.5,4),"simulada":fm(frac(zs,v=>v<=4),4)};

{

  pasos:[

    {t:"Covarianza", h:"Simetría $y\\mapsto-y$: $E(Y)=0=E(XY)$."},
    {t:"Independencia", h:"$Y\\mid X=x$ es uniforme en $[-x^2,x^2]$: depende de $x$."},
    {t:"(c)", h:"Hace falta $x^2>\\tfrac34-x$, o sea $x>\\tfrac12$: $\\int_{1/2}^1\\tfrac32(x^2+x-\\tfrac34)dx=\\tfrac7{16}$."}
  ],
  sim:{
    controles:[ {id:"s", label:"Umbral s en X + Y > s (×100)", min:0, max:200, step:1, val:75} ],
    draw:function(ctx,W,H,p){

      while(pts.length<4000){ const x=R(), y=2*R()-1; if(Math.abs(y)<=x*x) pts.push([x,y]); }
      const m=ejesIso(ctx,W*0.6,H,0,1,-1,1,{L:80,nx:4,ny:4,dx:2,dy:1,tit:'Región |y| ≤ x²; naranja: X + Y > s'});
      nube(ctx,m,pts,q=>q[0]+q[1]>s?C('--warn'):alpha(C('--accent2'),.6),1.5);

/* ══════ MOTOR — no editar ══════ */
const nav=document.getElementById('navlinks'), main=document.getElementById('main');
let grupoActual=null;

function ctlHTML(c){
  if(c.tipo==='check')
    return `<label class="ctl chk"><input type="checkbox" data-ctl="${c.id}" ${c.val?'checked':''}>${c.label}</label>`;
  if(c.tipo==='select')
    return `<label class="ctl">${c.label}<select data-ctl="${c.id}">`+
      c.opts.map((o,i)=>`<option value="${i}"${i===(c.val||0)?' selected':''}>${o}</option>`).join('')+`</select></label>`;
  return `<label class="ctl">${c.label} <span class="val" data-for="${c.id}">${c.val}</span>
     <input type="range" data-ctl="${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.val}"></label>`;
}

EJERCICIOS.forEach(e=>{
  if(e.g&&e.g!==grupoActual){grupoActual=e.g;
    const d=document.createElement('div');d.className='grp';d.textContent=e.g;nav.appendChild(d);}
  const a=document.createElement('a');
  a.href='#'+e.id; a.textContent=e.titulo; a.dataset.id=e.id;
  a.onclick=ev=>{ev.preventDefault();show(e.id);};
  nav.appendChild(a);

  const s=document.createElement('section');
  s.className='ej'; s.id=e.id;
  const accHTML=(e.sim&&e.sim.acciones||[]).map((b,i)=>`<button data-acc="${i}">${b.label}</button>`).join(' ');
  s.innerHTML=`
    <div class="tag">${e.tema||''}</div>
    <h2>${e.titulo}</h2>
    <div class="card enunciado"><h3>Enunciado</h3><div>${e.enunciado}</div></div>
    ${e.pasos&&e.pasos.length?`<div class="card"><h3>Resolución paso a paso</h3>
      <div class="stepbar">
        <button class="ghost" data-act="prev">◀ Anterior</button>
        <button data-act="next">Siguiente ▶</button>
        <button class="ghost" data-act="play">▶ Reproducir</button>
        <div class="dots">${e.pasos.map((_,k)=>`<div class="dot${k?'':' on'}"></div>`).join('')}</div>
      </div>
      <div class="steps">${e.pasos.map((q,k)=>
        `<div class="step${k?'':' show'}"><div class="stepnum">Paso ${k+1} de ${e.pasos.length} — ${q.t}</div><p>${q.h}</p></div>`).join('')}
      </div></div>`:''}
    ${e.sim?`<div class="card"><h3>Simulación interactiva</h3>
      <div class="controls">${(e.sim.controles||[]).map(ctlHTML).join('')}${accHTML?`<div style="display:flex;gap:8px">${accHTML}</div>`:''}</div>
      <canvas width="960" height="360"></canvas>
      <div class="stats"></div></div>`:''}
    ${e.resultado?`<div class="card resultado"><h3>Resultado</h3><div>${e.resultado}</div></div>`:''}
    <footer>Probabilidades y Estadística Matemática · Licenciatura en Matemática · FCEx–UNCPBA · Práctica 7</footer>`;
  main.appendChild(s);

  if(e.pasos&&e.pasos.length){
    let cur=0,timer=null;
    const steps=[].slice.call(s.querySelectorAll('.step')), dots=[].slice.call(s.querySelectorAll('.dot'));
    const render=()=>{steps.forEach((el,k)=>el.classList.toggle('show',k===cur));
                      dots.forEach((d,k)=>d.classList.toggle('on',k<=cur));};
    s.querySelector('[data-act=prev]').onclick=()=>{cur=Math.max(0,cur-1);render();};
    s.querySelector('[data-act=next]').onclick=()=>{cur=Math.min(steps.length-1,cur+1);render();};
    s.querySelector('[data-act=play]').onclick=ev=>{
      const btn=ev.currentTarget;
      if(timer){clearInterval(timer);timer=null;btn.textContent='▶ Reproducir';return;}
      cur=0;render();btn.textContent='❚❚ Pausar';
      timer=setInterval(()=>{ if(cur>=steps.length-1){clearInterval(timer);timer=null;btn.textContent='▶ Reproducir';return;}
                              cur++;render(); },3400);
    };
  }

  if(e.sim){
    const cv=s.querySelector('canvas'), ctx=cv.getContext('2d'), out=s.querySelector('.stats');
    const st={};
    const params=()=>{const p={};
      s.querySelectorAll('[data-ctl]').forEach(i=>{p[i.dataset.ctl]= i.type==='checkbox'?(i.checked?1:0):+i.value;});
      return p;};
    const paint=()=>{
      ctx.clearRect(0,0,cv.width,cv.height);
      const r=e.sim.draw(ctx,cv.width,cv.height,params(),st)||{};
      out.innerHTML=Object.keys(r).map(k=>`<div>${k}<b>${r[k]}</b></div>`).join('');
    };
    s.querySelectorAll('[data-ctl]').forEach(i=>i.addEventListener('input',()=>{
      const v=s.querySelector('[data-for="'+i.dataset.ctl+'"]'); if(v)v.textContent=i.value; paint();}));
    (e.sim.acciones||[]).forEach((b,i)=>{
      const btn=s.querySelector('[data-acc="'+i+'"]'); if(btn)btn.onclick=()=>b.fn(st,paint);});
    e.sim._paint=paint;
  }
});

function show(id){
  document.querySelectorAll('section.ej').forEach(s=>s.classList.toggle('active',s.id===id));
  document.querySelectorAll('#navlinks a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  const e=EJERCICIOS.filter(x=>x.id===id)[0];
  if(e&&e.sim&&e.sim._paint) e.sim._paint();
  history.replaceState(null,'','#'+id); window.scrollTo(0,0);
}
show((location.hash||'').slice(1)||EJERCICIOS[0].id);
window.addEventListener('resize',()=>{const a=document.querySelector('section.ej.active');
  if(a){const e=EJERCICIOS.filter(x=>x.id===a.id)[0]; if(e&&e.sim&&e.sim._paint)e.sim._paint();}});
</script>
